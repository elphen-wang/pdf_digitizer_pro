[project]
name = "pdf-digitizer"
version = "1.3.0"
description = "Extract vector curve data from PDF charts"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "PySide6>=6.6.0",
    "pywebview>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: tests that touch external resources",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
